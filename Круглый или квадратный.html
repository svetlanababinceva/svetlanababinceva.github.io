    //     всех должна стоять на одной высоте: что «тихо», что «яблоко» с
    //     высокой «б»;
    //   • подпись столбца — верх букв (надстрочные и прописные входят).
    //     Подпись в плашке одна и обычно с прописной буквы: если считать по
    //     x-height, «Фрукт» уезжает вверх на 4 px и плашка выглядит
    //     несимметричной.
    // Работает и для плашек слов, и для подписей столбцов.
    function alignInk(plate) {
      var textEl = plate.querySelector('.cl-phrase-text, .cl-col-text');
      if (!textEl) return;
      var isHead = plate.querySelector('.cl-col-text') === textEl;
      var tcs = window.getComputedStyle(textEl);
      var ctx = inkMeasureCtx();
      if (!ctx) return;
      // В шрифт для замера — ровно тот же, что у текста в таблице.
      ctx.font = tcs.fontStyle + ' ' + tcs.fontWeight + ' '
        + tcs.fontSize + ' ' + tcs.fontFamily;
      var m = ctx.measureText(String(textEl.textContent || '').trim());
      var fbA = m.fontBoundingBoxAscent;
      var fbD = m.fontBoundingBoxDescent;
      var abA = m.actualBoundingBoxAscent;
      // Браузер без этих метрик оставляет слово как есть: центрирование
      // строки уже сделано стилями.
      if (!isFinite(fbA) || !isFinite(fbD) || !isFinite(abA)) return;
      // Верх «плотной» части слова над базовой линией: у слова в строке —
      // высота строчной буквы, у подписи столбца — верх самих букв.
      var top = abA;
      if (!isHead) {
        var xh = ctx.measureText('\u0445').actualBoundingBoxAscent;
        if (isFinite(xh) && xh > 0) top = xh;
      }
      var plateBox = plate.getBoundingClientRect();
      var textBox = textEl.getBoundingClientRect();
      // Насколько середина строки ушла от середины плашки (в норме ≈ 0).
      var lineSkew = (textBox.top + textBox.height / 2)
        - (plateBox.top + plateBox.height / 2);
      // Насколько середина «плотной» части слова ушла от середины строки.
      var inkSkew = (fbA - fbD) / 2 - top / 2;
      textEl.style.transform = 'translateY(' + (-lineSkew - inkSkew).toFixed(2) + 'px)';
    }

    function onPick(ri, col) {
      var card = current();
      if (!card || card.answered || card.solved) return;
      var row = card.rows[ri];
      if (!row || row.result === true) return;
      // В строке — только одна галочка: повторный клик по тому же столбцу
      // снимает отметку, клик по другому — переносит её.
      row.sel = row.sel === col ? null : col;
      row.result = null;
      render();
    }

    function allPicked(card) {
      return card.rows.length > 0 && card.rows.every(function (r) { return r.sel !== null; });
    }
    function allRight(card) {
      return card.rows.length > 0 && card.rows.every(function (r) { return r.result === true; });
    }
    function allSolved() {
      return state.cards.length > 0 && state.cards.every(function (c) { return c.solved; });
    }

    // Ответить можно, когда все галочки на карточке проставлены. Сама кнопка
    // «Ответить» до этого момента не показывается (см. updateControls).
    function onAnswer() {
      var card = current();
      if (!card || card.answered || !allPicked(card)) return;
      var ok = true;
      card.rows.forEach(function (r) {
        var good = r.sel === r.column;
        r.result = good;
        if (!good) { r.wrong += 1; ok = false; }
      });
      card.answered = true;
      card.solved = ok;
      render();
      // Итоговый экран сам не открывается: его показывает только кнопка
      // «Завершить игру» — как btnOpenStats у остальных видов игр. Раньше
      // экран итогов всплывал через 900 мс и перекрывал таблицу сразу после
      // верного ответа.
    }

    // «Попробовать ещё»: верные галочки остаются, неверные снимаются.
    function onRetry() {
      var card = current();
      if (!card) return;
      card.rows.forEach(function (r) {
        if (r.result !== true) { r.sel = null; r.result = null; }
      });
      card.answered = false;
      card.solved = false;
      render();
    }

    function updateControls() {
      var card = current();
      if (!card) return;
      var picked = allPicked(card);
      var right = allRight(card);

      if (btnApply) {
        // Кнопка «Ответить» появляется только когда галочка стоит в КАЖДОЙ
        // строке: раньше она висела на экране неактивной и подсказывала, что
        // ответить можно и с неполной таблицей. Место под кнопку всё равно
        // занято (.actions имеет min-height), поэтому таблица не прыгает.
        btnApply.hidden = card.answered || card.solved || !picked;
        btnApply.disabled = !picked;
      }
      if (btnRetry) btnRetry.hidden = !(card.answered && !right);
      // «Завершить игру» — как btnOpenStats у других видов: только когда
      // решены все карточки.
      if (btnFinish) btnFinish.hidden = !allSolved();
      if (btnNext) btnNext.disabled = !(card.solved && !isLast());
      if (btnPrev) btnPrev.disabled = state.index <= 0;
      if (navCount) navCount.textContent = (state.index + 1) + ' из ' + state.cards.length;
      if (navBar) navBar.hidden = state.cards.length <= 1;
      gameProgress(state.cards.filter(function (c) { return c.solved; }).length, state.cards.length);
    }

    function finishMessage() {
      var name = String(data.playerName || '').replace(/\s+/g, ' ').trim().split(' ')[0];
      var m = String(data.motivation || '').replace(/\s+/g, ' ').trim() || 'Ты молодец!';
      if (m.length > 40) m = m.slice(0, 40);
      var text = m.charAt(0).toLowerCase() + m.slice(1);
      if (data.motivationShowName && name) text = name + ', ' + text;
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function showFinish() {
      // В просмотре прохождения итоговый экран не нужен: там одна карточка.
      if (data.review) return;
      if (finishEl && !finishEl.hidden) return;
      // Одна запись на карточку-таблицу (как у остальных видов — на карточку):
      // подпись, результат и ответ ученика для окна «Результаты прохождения».
      var words = [];
      state.cards.forEach(function (c) {
        var wrong = 0;
        c.rows.forEach(function (r) { wrong += (r.wrong || 0); });
        words.push({
          label: cardLabel(c),
          solved: allRight(c),
          attempts: wrong + 1,
          answer: {
            rows: c.rows.map(function (r) {
              // ri — исходный номер строки: в просмотре прохождения строки
              // могут быть перемешаны, и по нему находится нужная строка.
              return { ri: r.ri, text: r.text, column: r.column, sel: r.sel, result: r.result };
            })
          }
        });
      });
      var firstTry = 0, secondPlus = 0, unsolved = 0;
      words.forEach(function (w) {
        if (!w.solved) unsolved += 1;
        else if (w.attempts > 1) secondPlus += 1;
        else firstTry += 1;
      });
      var stats = { firstTry: firstTry, secondPlus: secondPlus, unsolved: unsolved, total: words.length };

      if (screenEl) screenEl.hidden = true;
      if (finishTextEl) finishTextEl.textContent = finishMessage();
      if (finishEl) { finishEl.hidden = false; finishEl.scrollTop = 0; }
      if (!state.reported) {
        state.reported = true;
        try {
          document.dispatchEvent(new CustomEvent('readtoa5:finished', {
            detail: { stats: stats, words: words }
          }));
        } catch (e) { /* старый браузер без CustomEvent */ }
      }
    }

    function showIndex(i) {
      if (i < 0 || i >= state.cards.length) return;
      state.index = i;
      if (finishEl) finishEl.hidden = true;
      if (screenEl) screenEl.hidden = false;
      render();
    }

    function resetAll() {
      state.cards.forEach(function (c) {
        c.rows.forEach(function (r) { r.sel = null; r.result = null; r.wrong = 0; });
        c.answered = false;
        c.solved = false;
      });
    }

    if (btnApply) btnApply.addEventListener('click', onAnswer);
    if (btnRetry) btnRetry.addEventListener('click', onRetry);
    if (btnFinish) btnFinish.addEventListener('click', showFinish);
    if (btnPrev) btnPrev.addEventListener('click', function () {
      if (state.index > 0) showIndex(state.index - 1);
    });
    if (btnNext) btnNext.addEventListener('click', function () {
      var card = current();
      if (card && card.solved && !isLast()) showIndex(state.index + 1);
    });
    if (btnRestart) btnRestart.addEventListener('click', function () {
      resetAll();
      state.reported = false;
      showIndex(0);
    });
    // «Посмотреть таблицы» с экрана итогов: возвращаемся к первой карточке
    // в уже проверенном виде (как btnWords у других видов).
    if (btnWords) btnWords.addEventListener('click', function () {
      showIndex(0);
    });

    // Пересчёт плашек после смены масштаба сцены (окно ↔ полный экран,
    // поворот телефона, изменение размера окна).
    //
    // Сцена 16:9 не перестраивается, а только масштабируется: все CSS-размеры
    // внутри неё считаются от единиц --u/--uw/--k (их ставит
    // stageScaleRuntime). Ширину и высоту плашек задаёт sizePlates — в
    // пикселях, посчитанных под текущий масштаб. Если масштаб изменился, а
    // плашки остались прежними, кегль вырос, слово перестало влезать и
    // обрезалось многоточием. Поэтому после смены масштаба раскладку плашек
    // считаем заново по тем же правилам — вид карточки остаётся тем же,
    // меняется только масштаб.
    // Через rAF: stageScaleRuntime обновляет единицы сцены тоже в rAF и
    // зарегистрирован раньше, значит к нашему колбэку они уже новые.
    function refitPlates() {
      if (!wrapEl) return;
      var table = wrapEl.querySelector('.cl-table');
      if (table) sizePlates(table);
    }
    function scheduleRefit() {
      if (window.requestAnimationFrame) window.requestAnimationFrame(refitPlates);
      else setTimeout(refitPlates, 16);
    }
    window.addEventListener('resize', scheduleRefit);
    window.addEventListener('orientationchange', scheduleRefit);
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange',
      'MSFullscreenChange'].forEach(function (evt) {
      document.addEventListener(evt, scheduleRefit);
    });

    // Шрифты и размер обёртки могут быть не готовы в момент первой отрисовки
    // (макет в редакторе появляется в скрытой закладке, iframe получает
    // размер позже, шрифт ещё не применён). Тогда sizePlates посчитал бы
    // плашки по нулевой или неполной ширине, и они остались бы «сжатыми» по
    // ширине до конца жизни страницы. Пересчитываем раскладку, когда шрифты
    // загрузились и когда обёртка реально получила ширину, — так же, как это
    // уже делает «Что к чему» (centerWordTexts).
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(refitPlates);
    }
    if (typeof ResizeObserver === 'function') {
      var lastWrapW = 0;
      new ResizeObserver(function () {
        var w = wrapEl.clientWidth;
        if (!w || w === lastWrapW) return;
        lastWrapW = w;
        scheduleRefit();
      }).observe(wrapEl);
    }

    // Первый шаг — общий startRuntime ядра: по «НАЧАТЬ» он показывает первую
    // карточку (в макете редактора ядро нажимает кнопку само). Имя игрока и
    // полноэкранный режим ядро подключает своими рантаймами.
    if (typeof startRuntime === 'function') startRuntime(showIndex);
    else showIndex(0);
  })(GAME_DATA, function computeStats(wordStates) {
    var firstTry = 0, secondPlus = 0, unsolved = 0;
    wordStates.forEach(function (w) {
      if (!w.solved) unsolved++;
      else if (w.failedApplies > 0) secondPlus++;
      else firstTry++;
    });
    return {
      firstTry: firstTry,
      secondPlus: secondPlus,
      unsolved: unsolved,
      total: wordStates.length
    };
  }, function buildFinishMessage(data) {
    var name = String(data && data.playerName || '')
      .replace(/\s+/g, ' ')
      .trim()
      .split(' ')[0];
    var motivation = String(data && data.motivation == null ? '' : data.motivation)
      .replace(/\s+/g, ' ')
      .trim();
    if (!motivation) motivation = 'Ты молодец!';
    if (motivation.length > 40) motivation = motivation.slice(0, 40);
    var text = motivation.charAt(0).toLowerCase() + motivation.slice(1);
    if (data && data.motivationShowName && name) text = name + ', ' + text;
    return text.charAt(0).toUpperCase() + text.slice(1);
  });
(function fullscreenRuntime() {
    'use strict';

    var btn = document.getElementById('btnFullscreen');
    if (!btn) return;

    // ---------- Автоподбор цвета значка под фон страницы ----------
    // Светлый фон → тёмно-серый значок (#4a4a4a), тёмный фон → белый (#ffffff).
    // Тон фона считает общий помощник backgroundToneRuntime (см. выше): тот же,
    // что выбирает тень плашки прогресса.
    if (typeof backgroundTone === 'function') {
      var tone = backgroundTone('bottom');
      if (tone) {
        document.documentElement.style.setProperty('--fs-btn-color', tone.dark ? '#ffffff' : '#4a4a4a');
      }
    }

    var docEl = document.documentElement;
    var requestFn = docEl.requestFullscreen || docEl.webkitRequestFullscreen
      || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
    var exitFn = document.exitFullscreen || document.webkitExitFullscreen
      || document.mozCancelFullScreen || document.msExitFullscreen;
    // Полноэкранный режим возможен, только если браузер умеет и включать
    // его, и выключать. Иначе кнопку не показываем.
    if (typeof requestFn !== 'function' || typeof exitFn !== 'function') {
      btn.hidden = true;
      return;
    }

    var isOn = function () {
      var el = document.fullscreenElement || document.webkitFullscreenElement
        || document.mozFullScreenElement || document.msFullscreenElement;
      return !!el;
    };

    // Подпись у кнопки теперь только служебная (title и aria-label):
    // видимой надписи нет, поэтому состояние видно по значку, а для
    // экранных читалок и при наведении — по этим атрибутам. Они всегда
    // соответствуют текущему состоянию.
    function refresh() {
      var on = isOn();
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      var title = on ? 'Выйти из полноэкранного режима' : 'Развернуть на полный экран';
      btn.title = title;
      btn.setAttribute('aria-label', title);
    }

    btn.addEventListener('click', function () {
      // Запрос полноэкранного режима должен идти из обработчика нажатия:
      // браузеры считают его жестом пользователя и отклоняют отложенный вызов.
      var p = isOn() ? exitFn.call(document) : requestFn.call(docEl);
      // Современный API возвращает промис, который может отклониться
      // (например, из-за политики браузера) — подпись обновляем в любом случае.
      if (p && typeof p.then === 'function') p.then(refresh, refresh);
      refresh();
    });

    // Выход по клавише Esc и сворачивание окна меняют состояние без нажатия
    // на кнопку — подпись обновляем по событию браузера.
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange',
      'MSFullscreenChange'].forEach(function (evt) {
      document.addEventListener(evt, refresh);
    });

    refresh();
  })();
</script>
