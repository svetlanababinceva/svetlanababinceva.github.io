    if (typeof backgroundTone === 'function') {
      var tone = backgroundTone('bottom');
      if (tone) {
        document.documentElement.style.setProperty('--fs-btn-color', tone.dark ? '#ffffff' : '#4a4a4a');
      }
    }

    var docEl = document.documentElement;
    var requestFn = docEl.requestFullscreen || docEl.webkitRequestFullscreen
      || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
    var exitFn = document.exitFullscreen || document.webkitExitFullscreen
      || document.mozCancelFullScreen || document.msExitFullscreen;
    // Полноэкранный режим возможен, только если браузер умеет и включать
    // его, и выключать. Иначе кнопку не показываем.
    if (typeof requestFn !== 'function' || typeof exitFn !== 'function') {
      btn.hidden = true;
      return;
    }

    var isOn = function () {
      var el = document.fullscreenElement || document.webkitFullscreenElement
        || document.mozFullScreenElement || document.msFullscreenElement;
      return !!el;
    };

    // Подпись у кнопки теперь только служебная (title и aria-label):
    // видимой надписи нет, поэтому состояние видно по значку, а для
    // экранных читалок и при наведении — по этим атрибутам. Они всегда
    // соответствуют текущему состоянию.
    function refresh() {
      var on = isOn();
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      var title = on ? 'Выйти из полноэкранного режима' : 'Развернуть на полный экран';
      btn.title = title;
      btn.setAttribute('aria-label', title);
    }

    btn.addEventListener('click', function () {
      // Запрос полноэкранного режима должен идти из обработчика нажатия:
      // браузеры считают его жестом пользователя и отклоняют отложенный вызов.
      var p = isOn() ? exitFn.call(document) : requestFn.call(docEl);
      // Современный API возвращает промис, который может отклониться
      // (например, из-за политики браузера) — подпись обновляем в любом случае.
      if (p && typeof p.then === 'function') p.then(refresh, refresh);
      refresh();
    });

    // Выход по клавише Esc и сворачивание окна меняют состояние без нажатия
    // на кнопку — подпись обновляем по событию браузера.
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange',
      'MSFullscreenChange'].forEach(function (evt) {
      document.addEventListener(evt, refresh);
    });

    refresh();
  })();
</script>


</body>
</html>
