        curH = nextH;
        guard += 1;
      }
    }

    function renderStage() {
      var c = currentCard();
      if (!c) return;

      // Верхняя строка карточки — её заголовок (card.question). Если он пуст,
      // шапка скрыта: «Краткое описание» в игру больше не попадает.
      var info = String(c.question || '').trim();
      if (infoEl) infoEl.textContent = info;
      if (headerEl) headerEl.hidden = !info;

      wordsLeftEl.innerHTML = '';
      wordsRightEl.innerHTML = '';
      cancelAlignAnimation();
      leftItems = [];
      rightItems = [];
      selected = null;
      dragLine = null;

      c.leftOrder.forEach(function (pairIndex, i) {
        var made = makeRow('left', i, c.pairs[pairIndex].first);
        wordsLeftEl.appendChild(made.row);
        leftItems.push({ row: made.row, word: made.word, dot: made.dot, pairIndex: pairIndex });
      });

      c.rightOrder.forEach(function (pairIndex, i) {
        var made = makeRow('right', i, c.pairs[pairIndex].second);
        wordsRightEl.appendChild(made.row);
        rightItems.push({ row: made.row, word: made.word, dot: made.dot, pairIndex: pairIndex });
      });

      updateDotStates();
      updateWordStates();
      fitWords();
      drawLinks();
      // Возврат на уже решённую карточку: строки второго столбца стоят
      // напротив своих пар сразу, без анимации. Анимация — только в момент
      // верного ответа (onAnswer), чтобы игрок увидел перестановку.
      if (c.solved) alignRightColumn(false);
      updateControls();
      // Первый замер бывает до того, как сцена получила окончательный размер,
      // поэтому размер шрифта пересчитываем ещё раз после отрисовки кадра:
      // иначе слова остаются мельче, чем позволяет карточка.
      scheduleFit();
    }

    // Отложенный пересчёт размера слов и линий (после отрисовки кадра).
    var fitRaf = 0;
    function scheduleFit() {
      if (fitRaf) cancelAnimationFrame(fitRaf);
      fitRaf = requestAnimationFrame(function () {
        fitRaf = 0;
        fitWords();
        drawLinks();
      });
    }

    // ---------- Выравнивание столбцов после верного ответа ----------
    //
    // Когда все пары собраны верно, слово второго столбца должно стоять в
    // одной строке со своей парой из первого. Порядок правых строк — это
    // перестановка левых, поэтому двигаем их FLIP-анимацией: запоминаем
    // экранные координаты, переставляем строки в DOM и возвращаем каждую из
    // старой позиции на новую через transform. Линии перерисовываются на
    // каждом кадре, поэтому остаются приклеенными к кружкам, пока строки едут.

    // Правые строки в порядке левых: для каждой левой строки — правая с тем же
    // номером пары. Если данные неполные, возвращаем null и ничего не двигаем.
    function alignedRightOrder() {
      var ordered = [];
      for (var j = 0; j < leftItems.length; j++) {
        var pairIndex = leftItems[j].pairIndex;
        for (var k = 0; k < rightItems.length; k++) {
          if (rightItems[k].pairIndex === pairIndex) {
            ordered.push(rightItems[k]);
            break;
          }
        }
      }
      return ordered.length === rightItems.length && ordered.length ? ordered : null;
    }

    var alignRaf = 0;
    var alignAnims = [];

    function alignNow() {
      return (window.performance && window.performance.now)
        ? window.performance.now() : Date.now();
    }

    function cancelAlignAnimation() {
      if (alignRaf) {
        cancelAnimationFrame(alignRaf);
        alignRaf = 0;
      }
      alignAnims.forEach(function (a) {
        try { a.cancel(); } catch (e) { /* анимация уже завершена */ }
      });
      alignAnims = [];
    }

    // animated = false — переставить строки молча (возврат на решённую
    // карточку, где анимация уже была показана в момент ответа).
    function alignRightColumn(animated) {
      var c = currentCard();
      if (!c) return;
      var ordered = alignedRightOrder();
      if (!ordered) return;

      var same = true;
      for (var i = 0; i < ordered.length; i++) {
        if (ordered[i] !== rightItems[i]) { same = false; break; }
      }
      if (same) { drawLinks(); return; }

      cancelAlignAnimation();

      var before = ordered.map(function (item) {
        return item.row.getBoundingClientRect().top;
      });
      // rightItems при этом не переупорядочиваем: в нём лежат ссылки на
      // элементы, а номера связей и dataset.idx кружков — это его индексы.
      // Строки в DOM переставляются, элементы остаются те же, поэтому связи
      // и клики продолжают работать без пересчёта.
      ordered.forEach(function (item) {
        wordsRightEl.appendChild(item.row);
      });

      // Старый браузер без Web Animations — просто переставляем строки.
      if (!animated || typeof ordered[0].row.animate !== 'function') {
        drawLinks();
        return;
      }

      var anims = [];
      ordered.forEach(function (item, i) {
        var after = item.row.getBoundingClientRect().top;
        var dy = before[i] - after;
        if (!dy) return;
        anims.push(item.row.animate(
          [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(0)' }],
          { duration: 420, easing: 'cubic-bezier(.22,.61,.36,1)' }
        ));
      });
      if (!anims.length) { drawLinks(); return; }

      alignAnims = anims;
      var started = alignNow();

      function tick() {
        drawLinks();
        var running = false;
        for (var i = 0; i < anims.length; i++) {
          if (anims[i].playState !== 'finished') { running = true; break; }
        }
        // 1.5 с — страховка: даже если браузер не сообщает об окончании
        // анимации, цикл перерисовки линий не должен жить вечно.
        if (running && alignNow() - started < 1500) {
          alignRaf = requestAnimationFrame(tick);
        } else {
          alignRaf = 0;
          alignAnims = [];
          drawLinks();
        }
      }
      alignRaf = requestAnimationFrame(tick);
    }

    // ---------- Кнопки ----------

    function allLinked() {
      var c = currentCard();
      if (!c) return false;
      var count = 0;
      Object.keys(c.links).forEach(function () { count++; });
      return c.pairs.length > 0 && count === c.pairs.length;
    }

    function updateControls() {
      var c = currentCard();

      var last = isLastCard();
      btnAnswer.hidden = !(c.phase === 'fill' && !c.solved && allLinked());
      btnReset.hidden = c.phase !== 'failed';
      btnFix.hidden = c.phase !== 'failed';
      btnPrev.disabled = state.index === 0;

      btnNext.disabled = !c.checked || last;

      afterChange();

    // Связь, в которой участвует слово: { left, right } или null.
    function linkOf(side, idx) {

      if (!c) return null;
      if (side === 'left') {
        if (c.links[idx] === undefined) return null;
        return { left: idx, right: c.links[idx] };
      }
      var found = null;
      Object.keys(c.links).forEach(function (li) {
        if (c.links[li] === idx) found = { left: Number(li), right: idx };

      return found;

    // ---------- Выбор пары кликом по плашке ----------
    //
    // Клик по слову:
    //   * по уже выбранному — снимает выбор;
    //   * при выбранном слове в другом столбце — соединяет кружки линией
    //     (прежние связи этих слов снимаются, как при перетаскивании);
    //   * по слову соединённой пары — разрывает её связь. После нажатия
    //     «Ответить» слова не меняются, поэтому разрыв работает только в
    //     фазе заполнения (fill), в том числе после «Исправить ошибки».
    // Разорванное слово становится выбранным: одним кликом по слову другого
    // столбца ему сразу можно назначить нового партнёра.
    function onWordClick(side, idx) {
      var c = currentCard();
      if (!c || c.phase !== 'fill' || c.solved) return;

      if (selected && selected.side === side && selected.idx === idx) {
        selected = null;
        afterChange();
        return;
      }

      // Выбрано слово в другом столбце — соединяем пару их кружков.
      if (selected && selected.side !== side) {
        var leftIdx = side === 'left' ? idx : selected.idx;
        var rightIdx = side === 'left' ? selected.idx : idx;
        selected = null;
        connect(leftIdx, rightIdx);
        return;
      }

      // Выбор в этом же столбце или его нет: у соединённого слова сначала
      // разрываем прежнюю связь, затем выбираем его для новой пары.
      var link = linkOf(side, idx);
      if (link) {
        delete c.links[link.left];
        delete c.results[link.left];
      }
      var item = (side === 'left' ? leftItems : rightItems)[idx];
      selected = { side: side, idx: idx, el: item ? item.dot : null };
      afterChange();

    function clearDrag() {
      if (dragLine && dragLine.parentNode) dragLine.parentNode.removeChild(dragLine);
      dragLine = null;
    }

    function dotAt(x, y) {

      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('pairs-dot')) return el;
        el = el.parentElement;
      }
      return null;

    // ---------- Перетаскивание (pointer events) ----------

    function onPointerDown(e) {
      var dot = e.target && e.target.classList && e.target.classList.contains('pairs-dot')
        ? e.target : null;
      if (!dot) return;
      var c = currentCard();
      if (!c || c.phase !== 'fill' || c.solved) return;
      e.preventDefault();

      var side = dot.dataset.side;
      var idx = Number(dot.dataset.idx);

      // Повторное нажатие на уже связанный левый кружок разрывает связь.
      if (side === 'left' && c.links[idx] !== undefined) {
        disconnectLeft(idx);
        return;

      selected = { side: side, idx: idx, el: dot };
      updateDotStates();
      try { dot.setPointerCapture(e.pointerId); } catch (err) { /* не критично */ }
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);

    }

    function onPointerMove(e) {
      if (!selected) return;

      var p1 = dotCenter(selected.el);
      var base = colsEl.getBoundingClientRect();
      dragLine = makeLine('pairs-line is-drag');
      dragLine.setAttribute('x1', p1.x);
      dragLine.setAttribute('y1', p1.y);
      dragLine.setAttribute('x2', e.clientX - base.left);
      dragLine.setAttribute('y2', e.clientY - base.top);
      svgEl.appendChild(dragLine);
    }

    function onPointerUp(e) {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
      var from = selected;
      selected = null;
      clearDrag();
      if (!from) return;

      var target = dotAt(e.clientX, e.clientY);
      if (target && target.dataset.side !== from.side) {
        var leftIdx = from.side === 'left' ? from.idx : Number(target.dataset.idx);
        var rightIdx = from.side === 'left' ? Number(target.dataset.idx) : from.idx;
        connect(leftIdx, rightIdx);
      } else {
        afterChange();
      }
    }

    // ---------- Проверка, сброс, исправление ----------

    function onAnswer() {
      var c = currentCard();
      if (!c || c.phase !== 'fill' || c.solved || !allLinked()) return;
      var allOk = true;
      Object.keys(c.links).forEach(function (li) {
        var l = leftItems[Number(li)];
        var r = rightItems[c.links[li]];
        var ok = !!l && !!r && l.pairIndex === r.pairIndex;
        c.results[li] = ok;
        if (!ok) allOk = false;
      });
      c.checked = true;
      if (allOk) {
        c.solved = true;
        c.phase = 'solved';
        selected = null;
      } else {
        c.failed += 1;
        c.phase = 'failed';
      }
      afterChange();
      // Все ответы верные — слова второго столбца переезжают в строки своих
      // пар. Линии при этом не рвутся: их перерисовывает сама анимация.
      if (allOk) alignRightColumn(true);
    }

    // «Соединить заново»: снимаем все связи и перемешиваем оба столбца.
    function onReset() {
      var c = currentCard();
      if (!c || c.phase !== 'failed') return;
      var order = c.pairs.map(function (p, i) { return i; });
      c.leftOrder = data.shuffle ? shuffle(order) : order.slice();
      c.rightOrder = data.shuffle ? shuffle(order) : order.slice();
      c.links = {};
      c.results = {};
      c.phase = 'fill';
      renderStage();
    }

    // «Исправить ошибки»: верные пары остаются, неверные связи снимаются.
    function onFix() {
      var c = currentCard();
      if (!c || c.phase !== 'failed') return;
      Object.keys(c.links).forEach(function (li) {
        if (c.results[li] !== true) {
          delete c.links[li];
          delete c.results[li];
        }
      });
      c.phase = 'fill';
      afterChange();
    }

    // ---------- Навигация ----------

    function showIndex(i) {
      if (!state || !state.cards.length) return;
      if (i < 0 || i >= state.cards.length) return;
      state.index = i;
      finishEl.hidden = true;
      screenEl.hidden = false;
      renderStage();
    }

    function goNext() {
      if (!state || isLastCard()) return;
      if (!currentCard().checked) return;
      showIndex(state.index + 1);
    }

    function showFinish() {
      screenEl.hidden = true;
      if (headerEl) headerEl.hidden = true;
      finishTextEl.textContent = buildFinishMessage(data);
      finishEl.hidden = false;
      finishEl.scrollTop = 0;
      var st = computeStats(state.cards.map(function (c) {
        return { solved: c.solved, failedApplies: c.failed };
      }));
      // label — вопрос карточки с парами.
      var words = state.cards.map(function (c) {
        return {
          label: String(c.question || '').trim(),
          solved: !!c.solved,
          attempts: (c.failed || 0) + 1,
          // Ответ игрока: какие слова он соединил между собой.
          answer: {
            links: Object.keys(c.links).map(function (li) {
              var l = c.pairs[Number(li)];
              var r = c.pairs[c.links[li]];
              return { first: l ? l.first : '', second: r ? r.second : '' };
            })
          }
        };
      });
      document.dispatchEvent(new CustomEvent('readtoa5:finished', {
        detail: { stats: st, words: words }
      }));
    }

    // ---------- Инициализация страницы ----------

    colsEl.addEventListener('pointerdown', onPointerDown);
    btnAnswer.addEventListener('click', onAnswer);
    btnReset.addEventListener('click', onReset);
    btnFix.addEventListener('click', onFix);
    btnPrev.addEventListener('click', function () {
      if (state && state.index > 0) showIndex(state.index - 1);
    });
    btnNext.addEventListener('click', goNext);
    btnOpenStats.addEventListener('click', function () { showFinish(); });
    document.getElementById('btnRestart').addEventListener('click', function () {
      initState();
      showIndex(0);
    });
    document.getElementById('btnWords').addEventListener('click', function () {
      showIndex(0);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
      else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (state && state.index > 0) btnPrev.click();
      }
    });

    // Линии привязаны к положению кружков, а размер слов — к размеру сцены,
    // поэтому после изменения размера окна (и сцены 16:9) пересчитываем и то,
    // и другое.
    window.addEventListener('resize', scheduleFit);

    initState();
    // Первый шаг: игровой экран остаётся скрытым (в разметке у #screen
    // стоит hidden), пока игрок не нажмёт «Начать».
    startRuntime(showIndex);
  })(GAME_DATA, function computeStats(wordStates) {
    var firstTry = 0, secondPlus = 0, unsolved = 0;
    wordStates.forEach(function (w) {
      if (!w.solved) unsolved++;
      else if (w.failedApplies > 0) secondPlus++;
      else firstTry++;
    });
    return {
      firstTry: firstTry,
      secondPlus: secondPlus,
      unsolved: unsolved,
      total: wordStates.length

  }, function buildFinishMessage(data) {
    var name = String(data && data.playerName || '')
      .replace(/\s+/g, ' ')
      .trim()
      .split(' ')[0];
    var motivation = String(data && data.motivation == null ? '' : data.motivation)
      .replace(/\s+/g, ' ')
      .trim();
    if (!motivation) motivation = 'Ты молодец!';
    if (motivation.length > 40) motivation = motivation.slice(0, 40);
    var text = motivation.charAt(0).toLowerCase() + motivation.slice(1);
    if (data && data.motivationShowName && name) text = name + ', ' + text;
    return text.charAt(0).toUpperCase() + text.slice(1);

    var btn = document.getElementById('btnFullscreen');

    // Светлый фон → тёмно-серый значок (#4a4a4a), тёмный фон → белый (#ffffff).
    // Тон фона считает общий помощник backgroundToneRuntime (см. выше): тот же,
    // что выбирает тень плашки прогресса.
    if (typeof backgroundTone === 'function') {
      var tone = backgroundTone('bottom');
      if (tone) {
        document.documentElement.style.setProperty('--fs-btn-color', tone.dark ? '#ffffff' : '#4a4a4a');
      }
    }

    var docEl = document.documentElement;
    var requestFn = docEl.requestFullscreen || docEl.webkitRequestFullscreen
      || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
    var exitFn = document.exitFullscreen || document.webkitExitFullscreen
      || document.mozCancelFullScreen || document.msExitFullscreen;

    // его, и выключать. Иначе кнопку не показываем.

      btn.hidden = true;

        || document.mozFullScreenElement || document.msFullscreenElement;

    };

    // Подпись у кнопки теперь только служебная (title и aria-label):
    // видимой надписи нет, поэтому состояние видно по значку, а для
    // экранных читалок и при наведении — по этим атрибутам. Они всегда

      btn.title = title;

    btn.addEventListener('click', function () {
      // Запрос полноэкранного режима должен идти из обработчика нажатия:
      // браузеры считают его жестом пользователя и отклоняют отложенный вызов.
      var p = isOn() ? exitFn.call(document) : requestFn.call(docEl);
      // Современный API возвращает промис, который может отклониться
      // (например, из-за политики браузера) — подпись обновляем в любом случае.
      if (p && typeof p.then === 'function') p.then(refresh, refresh);
      refresh();

    // Выход по клавише Esc и сворачивание окна меняют состояние без нажатия
    // на кнопку — подпись обновляем по событию браузера.
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange',

</script>
